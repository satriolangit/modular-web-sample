<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARSI Platform</title>
    <meta name="theme-color" content="#551AB9" />
    <script>
      try {
        var raw = localStorage.getItem('container:theme');
        if (raw && JSON.parse(raw).state.theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
