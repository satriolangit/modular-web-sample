trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  clientName: client-a
  dockerRepository: arsi-web-client-a

steps:
  - checkout: self
    path: web-extension-client-a
  - checkout: git://MyOrg/web-container
    path: web-container
  - checkout: git://MyOrg/web-modules
    path: web-modules

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: |
      cd $(Pipeline.Workspace)/web-modules
      npm ci
      cd $(Pipeline.Workspace)/web-extension-client-a
      npm ci
      cd $(Pipeline.Workspace)/web-container
      ln -sfn ../web-extension-client-a current-client
      npm ci
    displayName: Install dependencies

  - script: |
      cd $(Pipeline.Workspace)/web-modules
      npm run typecheck
      npm test
      cd $(Pipeline.Workspace)/web-extension-client-a
      npm run typecheck
      npm test
      cd $(Pipeline.Workspace)/web-container
      npm run typecheck
      npm run build:client-a
    displayName: Verify and build

  - task: Docker@2
    inputs:
      command: buildAndPush
      repository: $(dockerRepository)
      dockerfile: $(Pipeline.Workspace)/web-container/Dockerfile
      buildContext: $(Pipeline.Workspace)
      tags: |
        $(Build.BuildId)

  - task: KubernetesManifest@1
    inputs:
      action: deploy
      manifests: k8s/staging.yaml
      containers: myorg.azurecr.io/$(dockerRepository):$(Build.BuildId)
